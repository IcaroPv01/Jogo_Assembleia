name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-caladea fonts-crosextra-carlito && pip install reportlab
      - working-directory: ferramentas
        run: |
          npm install
          node gen_cartas.js economia_baralho.json
          python3 gen_pdf.py saida/economia
          node gen_tabuleiro.js economia_baralho.json
          python3 gen_pdf_tabuleiro.py saida/economia
      - run: |
          mkdir _site && cp -r ferramentas/saida/economia/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
